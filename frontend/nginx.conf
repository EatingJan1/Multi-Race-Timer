server {
    listen 80;
    server_name localhost;
    server_tokens off;
    
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' http://localhost:5002 http://127.0.0.1:5002 ws: wss:; frame-ancestors 'none';" always;
    
    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse proxy for API requests to the backend container
    location /api/ {
        proxy_pass http://backend:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M;
    }
    
    # Static files routing
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching for index.html so updates are immediately visible
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Cache static assets (CSS, images, icons, audio)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|mp3)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # JavaScript files: short cache to prevent stale application logic
    location ~* \.js$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
}
