services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeit-backend
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - zeit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zeit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zeit-network

networks:
  zeit-network:
    driver: bridge

volumes:
  data:
