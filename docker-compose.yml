services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeit-backend
    expose:
      - "5002"
    ports:
      - "127.0.0.1:5002:5002"
    volumes:
      - ./data:/app/data
      - ./var:/app/var
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - DISABLE_SELF_UPDATE=true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - zeit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zeit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - zeit-network

networks:
  zeit-network:
    driver: bridge
